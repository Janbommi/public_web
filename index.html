<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSABU 에이전트 오피스</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 공개 현황판 — 폰에서 보는 화면이다. 로컬 대시보드(index.html)와 같은 모양으로
 * 맞췄다: 어두운 앱 프레임 안에 따뜻한 원목 사무실.
 *
 * 로컬 화면과 다른 점 (개인정보 분리, 사용자 결정 09-18):
 *   - 말풍선에 **작업 내용**이 올라가지 않는다. 공개 JSON 에 아예 없다.
 *   - 대화·브리핑 이벤트 패널이 없다. 출산 정보도 없다.
 *   - 활동 시각만 공개한다. 실시간 작업 상태를 추정하지 않는다.
 */
:root {
  --bg:        #0E1420;
  --panel:     #151D2B;
  --panel-2:   #1A2434;
  --panel-3:   #202B3E;
  --line:      #263148;
  --line-soft: #1E2839;
  --ink:       #E7EDF7;
  --ink-soft:  #94A2B9;
  --ink-faint: #667490;
  --sel:       #8CA0FF;

  --work: #3FD6A8;  --work-bg: #123328;
  --idle: #93A1B8;  --idle-bg: #1C2535;
  --halt: #FF7B72;  --halt-bg: #33191C;
  --off:  #55607A;  --off-bg:  #171F2C;

  /* 사무실 내부 — sprites.js ROOM_LIGHT 와 어울리는 따뜻한 쪽 */
  --wall:      #E9DECE;
  --wall-dark: #D6C7B2;
  --floor:     #CBAE8A;
  --sky:       #6FB3DE;

  --display: "Jua", "Gothic A1", "Malgun Gothic", sans-serif;
  --body:    "Gothic A1", "Malgun Gothic", -apple-system, sans-serif;
  --mono:    "IBM Plex Mono", "Consolas", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.6 var(--body); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.app { max-width: 1100px; margin: 0 auto; padding: 12px; display: grid; gap: 12px; }

/* --- 상단 요약 ----------------------------------------------------------- */
.topbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat {
  padding: 10px 12px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 7px; min-width: 0;
}
.stat b { font: 600 20px/1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span {
  font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stat i { width: 7px; height: 7px; border-radius: 99px; background: var(--idle); flex-shrink: 0; }
.stat.work i { background: var(--work); } .stat.work b { color: var(--work); }
.stat.halt i { background: var(--halt); } .stat.halt b { color: var(--halt); }

.conn {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 13px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line);
  font: 400 11.5px/1.5 var(--mono); color: var(--ink-faint);
}
.conn b { display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--work); }
.conn b::before {
  content: ""; width: 7px; height: 7px; border-radius: 99px; background: currentColor;
  animation: beat 2.4s ease-in-out infinite;
}
.conn.stale b { color: #E0B062; }
.conn.down b, .conn.halt b { color: var(--halt); }
.conn.down b::before, .conn.halt b::before { animation: none; }
@keyframes beat { 50% { opacity: .25; } }

/* --- 사무실 -------------------------------------------------------------- */
/* 사무실은 **캔버스 한 장**이다 (office.js). 여기서는 그 위에 얹는 글자만 꾸민다.
 * 벽·바닥·책상을 CSS 로 그리던 시절의 .zone / .seat 규칙은 전부 없앴다 —
 * 사람이 책상 앞을 지나가려면 앞뒤 순서가 필요한데 DOM 으로는 그릴 수 없다. */
.floorplan {
  border-radius: 12px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line);
}
.office { width: 100%; min-height: 180px; padding: 8px 0; }

.stage { position: relative; margin: 0 auto; }
.scene { display: block; image-rendering: pixelated; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

/* 방 이름표 — 벽에 걸린 명패. 좌표는 office.js 가 transform 으로 준다. */
.plate {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 7px; border-radius: 5px;
  background: #FBF7F1; border: 1px solid var(--wall-dark);
  font: 400 11.5px/1.45 var(--display); color: #3A3026; white-space: nowrap;
}
.plate b {
  font: 500 9px/1 var(--mono); color: #7A6A57;
  padding-left: 5px; border-left: 1px solid var(--wall-dark);
}

/* 사람 한 명 — 캐릭터 위에 겹쳐 둔 투명 버튼. 걸어다니면 같이 따라간다.
 * 클릭·키보드·스크린리더가 여기서 공짜로 따라온다 (캔버스는 aria-hidden). */
.who {
  position: absolute; top: 0; left: 0; padding: 0; margin: 0; border: 0;
  background: none; pointer-events: auto; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.who .bub {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  max-width: 118px; padding: 2px 7px; border-radius: 7px;
  background: #FBF7F1; border: 1px solid var(--wall-dark);
  font: 400 10px/1.55 var(--body); color: #3A3026;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 한 칸 걸러 말풍선을 더 높이 띄운다 — 옆자리와 겹치지 않게 (office.js 가 켠다) */
.who.hi .bub { bottom: calc(100% + 26px); }
/* 말풍선과 머리를 잇는 실선. .bub 에 넣으면 overflow:hidden 에 잘려 안 보인다. */
.who.hi::after {
  content: ""; position: absolute; left: 50%; bottom: calc(100% + 9px);
  width: 1px; height: 17px; background: var(--wall-dark);
}

/* 방 가장자리에서는 가운데 정렬을 버리고 안쪽으로 붙인다 (office.js 가 켠다) */
.who.bl .bub { left: 0; transform: none; }
.who.br .bub { left: auto; right: 0; transform: none; }
.who .nm {
  position: absolute; top: calc(100% - 1px); left: 50%; transform: translateX(-50%);
  max-width: 78px; padding: 1px 5px; border-radius: 4px;
  background: rgba(32,24,16,.74); color: #F6EFE3;
  font: 600 9.5px/1.6 var(--body);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.who.off { opacity: .55; }
.who.on .nm { background: var(--sel); color: #14121C; }
.who:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; border-radius: 4px; }

/* --- 카드 공통 ----------------------------------------------------------- */
.card { border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.card > h2 {
  margin: 0; padding: 10px 13px 8px;
  font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint); border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.card > h2 span { font-weight: 600; color: var(--ink-soft); letter-spacing: 0; }

/* 선택한 사람 요약 (공개 범위: 이름·역할·마지막 활동·호출 수) */
.pick { padding: 11px 13px 13px; display: flex; gap: 11px; align-items: center; }
.pick canvas { display: block; image-rendering: pixelated; flex-shrink: 0; }
.pick .who-n { font: 400 17px/1.2 var(--display); }
.pick .who-r { font-size: 12px; color: var(--ink-soft); }
.pick dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 0; }
.pick dt { font: 400 10.5px/1.5 var(--mono); color: var(--ink-faint); white-space: nowrap; }
.pick dd { margin: 0; font: 400 11.5px/1.5 var(--mono); }
.badge {
  display: inline-flex; align-items: center; gap: 5px; margin-left: auto; align-self: flex-start;
  padding: 3px 9px; border-radius: 99px;
  font: 500 11px/1.4 var(--body); background: var(--idle-bg); color: var(--idle);
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.badge.work { background: var(--work-bg); color: var(--work); }
.badge.halt { background: var(--halt-bg); color: var(--halt); }
.badge.off  { background: var(--off-bg);  color: var(--off); }

/* --- 숫자 --------------------------------------------------------------- */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.metric { padding: 13px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.metric .k {
  font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
}
.metric .v {
  font: 600 21px/1.2 var(--mono); font-variant-numeric: tabular-nums; margin-top: 6px;
}
.metric .sub { font: 400 11px/1.5 var(--mono); color: var(--ink-soft); margin-top: 1px; }
.track { height: 4px; margin-top: 8px; border-radius: 99px; background: var(--panel-3); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 99px; background: var(--work); transition: width .5s ease; }
.track > i.mid { background: #E0B062; }
.track > i.high { background: var(--halt); }

/* --- 히트맵 ------------------------------------------------------------- */
.heatwrap { padding: 12px 13px 9px; overflow-x: auto; }
.heat {
  --cell: 13px;
  display: grid; gap: 3px; justify-content: center;
  grid-template-columns: max-content repeat(24, var(--cell));
}
.heat .d { font: 500 10px/1 var(--mono); color: var(--ink-faint);
  padding-right: 7px; align-self: center; white-space: nowrap; }
.heat .c { height: var(--cell); border-radius: 2px; background: var(--panel-3); }
.heat .c.l1 { background: #1F4A3E; } .heat .c.l2 { background: #2A7360; }
.heat .c.l3 { background: #339C7F; } .heat .c.l4 { background: #3FD6A8; }
.heat .h { font: 400 9px/1 var(--mono); color: var(--ink-faint); text-align: center; padding-top: 3px; }
.heatfoot {
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 8px 13px 0; font: 400 10.5px/1.5 var(--mono); color: var(--ink-faint);
}
.lg { display: inline-flex; align-items: center; gap: 4px; }
.lg i { width: 9px; height: 9px; border-radius: 2px; background: var(--panel-3); }
.lg i.l1 { background: #1F4A3E; } .lg i.l2 { background: #2A7360; }
.lg i.l3 { background: #339C7F; } .lg i.l4 { background: #3FD6A8; }

/* --- 명단 --------------------------------------------------------------- */
.roster { list-style: none; margin: 0; padding: 4px; }
.roster li { margin: 0; }
.roster button {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 8px 9px; border: 0; border-radius: 8px; background: none;
  text-align: left; cursor: pointer;
}
.roster button[aria-pressed="true"] { background: var(--panel-3); }
.roster .rd { width: 7px; height: 7px; border-radius: 99px; background: var(--idle); flex-shrink: 0; }
.roster .work .rd { background: var(--work); }
.roster .halt .rd { background: var(--halt); }
.roster .off  .rd { background: var(--off); }
.roster .rn { font-weight: 700; font-size: 12.5px; flex-shrink: 0; min-width: 48px; }
.roster .rr { font-size: 11.5px; color: var(--ink-faint); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster .bar { width: 44px; height: 4px; border-radius: 99px; background: var(--panel-3);
  overflow: hidden; flex-shrink: 0; }
.roster .bar > i { display: block; height: 100%; background: var(--work); border-radius: 99px; }
.roster .rt { font: 400 11px/1 var(--mono); color: var(--ink-soft); white-space: nowrap;
  min-width: 56px; text-align: right; }

.colophon {
  padding: 2px 4px 8px; font: 400 11px/1.7 var(--body); color: var(--ink-faint);
}
.colophon code { font-family: var(--mono); }

@media (prefers-reduced-motion: reduce) {
  .conn b::before { animation: none; }
}
@media (max-width: 720px) {
  .app { padding: 10px; gap: 10px; }
  .topbar { grid-template-columns: 1fr 1fr; }
  .heat { --cell: 11px; gap: 2px; }
  .roster .bar { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="stat"><b id="s-total">–</b><span>전체</span></div>
    <div class="stat work"><i></i><b id="s-work">–</b><span>작업 중</span></div>
    <div class="stat"><i></i><b id="s-idle">–</b><span>휴식·대기</span></div>
    <div class="stat halt"><i></i><b id="s-down">–</b><span>정지</span></div>
  </div>

  <div class="conn" id="conn">
    <b id="conn-t">불러오는 중</b>
    <span id="conn-s"></span>
  </div>

  <section class="floorplan" aria-label="사무실">
    <div class="office" id="office"></div>
  </section>

  <div class="card" id="pick" hidden>
    <h2>선택한 팀원 <span id="pick-close" role="button" tabindex="0" style="cursor:pointer">닫기 ✕</span></h2>
    <div class="pick" id="pick-body"></div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="k">오늘 비용</div>
      <div class="v" id="cost">–</div>
      <div class="sub" id="cost-sub">–</div>
      <div class="track"><i id="track" style="width:0"></i></div>
    </div>
    <div class="metric">
      <div class="k">이번 달</div>
      <div class="v" id="month">–</div>
      <div class="sub" id="month-sub">–</div>
    </div>
    <div class="metric">
      <div class="k">기사 수집</div>
      <div class="v" id="a-today">–</div>
      <div class="sub" id="a-total">–</div>
    </div>
    <div class="metric">
      <div class="k">7일 호출</div>
      <div class="v" id="calls">–</div>
      <div class="sub" id="calls-sub">–</div>
    </div>
  </div>

  <section class="card">
    <h2>활동 (7일) <span id="heat-sum">–</span></h2>
    <div class="heatwrap"><div class="heat" id="heat" role="img" aria-label="최근 7일 시간대별 활동량"></div></div>
    <div class="heatfoot">
      <span id="heat-stat">–</span>
      <span class="lg">적음 <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 많음</span>
    </div>
  </section>

  <section class="card">
    <h2>마지막 활동 <span id="l-count"></span></h2>
    <ul class="roster" id="list"></ul>
  </section>

  <div class="colophon">
    화면을 보는 동안 약 5초마다 상태를 확인합니다. 저장소·네트워크에 따라 지연될 수 있습니다.
    팀 구성 · 활동 <b>시각</b> · 비용 · 호출 수만 담겨 있습니다 — 대화 내용과 개인 일정은 올라오지 않습니다.
    <div id="read-at" style="margin-top:4px"></div>
  </div>
</div>

<script src="sprites.js"></script>
<script src="office.js?v=20260923-motion3"></script>
<script>
/* 공개 JSON(state.json)을 office.js 가 아는 모양으로 옮긴다.
 *
 * 봇이 안전한 상태 분류만 공개 JSON으로 자동 동기화한다. 질문·답변·작업 원문은
 * 포함하지 않는다. 공개 화면은 저장소 원본을 먼저 읽고 실패하면 Pages로 돌아간다.
 */
const REFRESH_MS = 5000;
const STALE_MIN = 12;     // 이 분을 넘으면 갱신이 늦은 것
const DEAD_MIN = 40;

const $ = (id) => document.getElementById(id);
const usd = (n) => "$" + Number(n).toFixed(n < 1 ? 3 : 2);
const num = (n) => Number(n).toLocaleString("ko-KR");
const office = createOffice({ room: "light" });
window.__office = office;   // 브라우저 콘솔·검증 스크립트에서 사무실을 들여다볼 때

let snap = null;       // 마지막으로 읽은 공개 JSON
let list = [];         // office.js 가 쓰는 모양으로 옮긴 명단
let zones = [];
let selected = null;

function minsSince(iso, nowMs) {
  if (!iso) return Infinity;
  // last_seen 은 타임존 없는 UTC, updated 는 오프셋이 붙은 KST 다.
  const d = new Date(/[+Z]/.test(iso) ? iso : iso + "Z");
  return isNaN(d) ? Infinity : (nowMs - d.getTime()) / 60000;
}

/** 공개 JSON → office.js 의 에이전트 모양. 없는 값은 만들어 넣지 않는다. */
function adapt(s, nowMs) {
  const down = !s.bot_alive || minsSince(s.updated, nowMs) >= DEAD_MIN;
  const statusOf = (m) =>
    s.halted ? "halted"
    : down ? "offline"
    : m.status === "success" ? (minsSince(m.status_since, nowMs) < 2 ? "success" : "idle")
    : m.status === "working" ? "working"
    : "idle"; // 최근 활동 시각으로 추정하지 않고 봇이 보낸 상태만 쓴다.

  const one = (m, team, isLead) => ({
    id: m.key,
    name: m.name,
    emoji: m.emoji,
    role: m.title,
    team: team,
    isLead: isLead,
    isChief: !!m.is_chief,
    parentId: m.parent_id || null,
    kind: "agent",
    stateSource: s.live_status_available ? "published" : "activity",
    status: statusOf(m),
    // 공개 JSON에는 안전한 짧은 분류만 있고 질문·답변·작업 원문은 없다.
    currentTask: m.status_text || null,
    idleLine: m.idle_line,
    elapsedSec: null,
    lastSeen: m.last_seen,
    calls7d: m.calls_7d || 0,
  });

  // 공개 JSON 의 팀에는 키가 없다 (이모지·이름뿐). 자리 배치용 키를 여기서 붙인다.
  if (s.roster) {
    const rows = s.roster.map(m => one(m, m.team, m.is_lead));
    for (const resident of s.residents || []) rows.push({
      id: resident.key, name: resident.name, role: resident.title, team: "office",
      kind: "user", status: "idle", isChief: false, isLead: false, stateSource: "avatar",
    });
    return { rows, zs: s.zones };
  }
  const zs = s.teams.map((t, i) => ({ key: "z" + i, emoji: t.emoji, label: t.label }));
  const rows = [one(s.lead, "lead", true)];
  s.teams.forEach((t, i) => {
    for (const m of t.members) rows.push(one(m, "z" + i, false));
  });
  return { rows, zs };
}

/* 사무실이 차지해도 되는 세로. 폰에서는 스크롤되는 페이지라 넉넉히 준다. */
function officeBudget() {
  return Math.max(430, Math.min(720, Math.round(window.innerHeight * 0.58)));
}

function renderSummary(s, nowMs) {
  const sum = summarize(list);
  $("s-total").textContent = sum.total;
  $("s-work").textContent = s.live_status_available ? sum.working : "–";
  $("s-idle").textContent = s.live_status_available ? sum.idle : "–";
  $("s-down").textContent = sum.halted + sum.offline;

  // 순서가 중요하다: 비상 정지 > 봇 꺼짐 > 갱신 끊김 > 지연 > 정상
  const mins = (nowMs - new Date(s.updated).getTime()) / 60000;
  const conn = $("conn");
  let cls = "", text = s.live_status_available ? "상태 자동 동기화" : "활동 기록 갱신됨";
  if (s.halted) { cls = "halt"; text = "비상 정지"; }
  else if (s.bot_alive === false) { cls = "down"; text = "봇 꺼짐"; }
  else if (mins >= DEAD_MIN) { cls = "down"; text = "갱신 끊김"; }
  else if (mins >= STALE_MIN) { cls = "stale"; text = "갱신 지연"; }
  conn.className = "conn" + (cls ? " " + cls : "");
  $("conn-t").textContent = text;
  const ago = agoText(s.updated, nowMs);
  $("conn-s").textContent = (ago ? "갱신 " + ago : "") +
    (s.live_status_available ? " · 약 5초마다 확인 · 전송 지연 가능" : " · 마지막 내보내기 기준");
}

function renderPick() {
  const box = $("pick");
  const a = selected ? list.find((x) => x.id === selected) : null;
  if (!a) { box.hidden = true; return; }
  box.hidden = false;

  const meta = !snap.live_status_available && a.status === "idle"
    ? {label: "실시간 상태 미연결", tone: "off"} : statusMeta(a.status);
  const body = $("pick-body");
  body.textContent = "";

  const cv = document.createElement("canvas");
  paintPortrait(cv, a.id, { scale: 3, mode: deskMode(a.status), palette: office.palette() });
  const who = document.createElement("div");
  const n = document.createElement("div"); n.className = "who-n"; n.textContent = a.name;
  const r = document.createElement("div"); r.className = "who-r"; r.textContent = a.role;
  const dl = document.createElement("dl");
  for (const [k, v] of [["마지막 활동", agoText(a.lastSeen) || "기록 없음"],
                        ["7일 호출", a.calls7d + "회"]]) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  who.append(n, r, dl);
  const bd = document.createElement("span");
  bd.className = "badge " + meta.tone;
  bd.textContent = meta.label;
  body.append(cv, who, bd);
}

function renderList() {
  const ul = $("list");
  ul.textContent = "";
  const agentRows = list.filter(a => a.kind !== "user");
  $("l-count").textContent = agentRows.length + "명";
  const top = Math.max(1, ...agentRows.map((a) => a.calls7d || 0));
  for (const a of agentRows) {
    const meta = !snap.live_status_available && a.status === "idle"
      ? {label: "실시간 상태 미연결", tone: "off"} : statusMeta(a.status);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = meta.tone;
    b.setAttribute("aria-pressed", a.id === selected ? "true" : "false");
    b.setAttribute("aria-label", a.name + " · " + a.role + " · " + meta.label);

    const d = document.createElement("span"); d.className = "rd";
    const nm = document.createElement("span"); nm.className = "rn"; nm.textContent = a.name;
    const rr = document.createElement("span"); rr.className = "rr"; rr.textContent = a.role;
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.title = "최근 7일 " + a.calls7d + "회 호출";
    const fill = document.createElement("i");
    fill.style.width = Math.round((a.calls7d / top) * 100) + "%";
    bar.append(fill);
    const rt = document.createElement("span"); rt.className = "rt";
    rt.textContent = agoText(a.lastSeen) || "기록 없음";

    b.append(d, nm, rr, bar, rt);
    b.addEventListener("click", () => select(a.id));
    li.append(b);
    ul.append(li);
  }
}

function renderHeat(act) {
  const box = $("heat");
  box.textContent = "";
  if (!act || !act.days) { $("heat-stat").textContent = "기록 없음"; return; }
  const peak = act.peak || 0;
  let total = 0;
  for (const day of act.days) {
    const lab = document.createElement("div");
    lab.className = "d";
    lab.textContent = day.weekday + " " + day.label;
    box.append(lab);
    for (let h = 0; h < 24; h++) {
      const n = day.hours[h] || 0;
      total += n;
      const c = document.createElement("div");
      const lv = n === 0 || peak === 0 ? 0 : Math.min(4, Math.ceil((n / peak) * 4));
      c.className = "c" + (lv ? " l" + lv : "");
      c.title = day.label + " " + h + "시 · " + n + "회";
      box.append(c);
    }
  }
  box.append(document.createElement("div"));
  for (let h = 0; h < 24; h++) {
    const t = document.createElement("div");
    t.className = "h";
    t.textContent = h % 6 === 0 ? h : "";
    box.append(t);
  }
  $("heat-sum").textContent = num(total) + "회";
  $("heat-stat").textContent = "가장 바쁜 한 시간 " + num(peak) + "회 · 하루 평균 " +
    Math.round(total / act.days.length) + "회";
  return total;
}

function select(id) {
  selected = selected === id ? null : id;
  render(snap);
}

function render(s) {
  snap = s;
  const nowMs = Date.now();
  const a = adapt(s, nowMs);
  list = a.rows;
  zones = a.zs;

  renderSummary(s, nowMs);
  renderOffice($("office"), office, list, zones,
               { maxH: officeBudget(), onSelect: select, selectedId: selected });
  renderPick();
  renderList();
  const week = renderHeat(s.activity);

  const c = s.cost;
  $("cost").textContent = usd(c.today_usd);
  $("cost-sub").textContent = "한도 " + usd(c.daily_limit) + " · " + num(c.today_calls) + "회";
  const pct = c.daily_limit > 0 ? Math.min(100, (c.today_usd / c.daily_limit) * 100) : 0;
  const tr = $("track");
  tr.style.width = pct + "%";
  tr.className = pct >= 80 ? "high" : pct >= 50 ? "mid" : "";

  $("month").textContent = usd(c.month_usd);
  $("month-sub").textContent = num(c.month_calls) + "회 호출";
  $("a-today").textContent = num(s.articles.today) + "건";
  $("a-total").textContent = "누적 " + num(s.articles.total) + "건";
  if (week !== undefined) {
    $("calls").textContent = num(week) + "회";
    $("calls-sub").textContent = "하루 평균 " + Math.round(week / 7) + "회";
  }

  $("read-at").textContent = "이 화면을 읽은 시각 " +
    new Date().toLocaleString("ko-KR", { hour: "2-digit", minute: "2-digit" });
}

// Read only the existing public state; no credentials or private API endpoints.
// The raw repository file becomes available without waiting for a Pages build.
class PublicStateReader {
  constructor({rawUrl=null,pageUrl='state.json',fetcher=(...args)=>fetch(...args),now=Date.now,timeoutMs=4500}={}) {
    Object.assign(this,{rawUrl,pageUrl,fetcher,now,timeoutMs});
    this.latest=null;this.pending=null;this.retryRawAt=0;
  }
  async request(url) {
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),this.timeoutMs);
    try {
      const res=await this.fetcher(url+'?t='+this.now(),{cache:'no-store',credentials:'omit',redirect:'error',signal:controller.signal});
      if(!res.ok)throw new Error('state HTTP '+res.status);
      const state=await res.json();
      if(!Number.isFinite(Date.parse(state.updated))||!Array.isArray(state.roster)||!Array.isArray(state.zones)||!state.cost||!state.articles)
        throw new Error('invalid public state');
      return state;
    } finally {clearTimeout(timer);}
  }
  read() {
    if(!this.pending)this.pending=this.load().finally(()=>{this.pending=null;});
    return this.pending;
  }
  async load() {
    const urls=this.rawUrl&&this.now()>=this.retryRawAt?[this.rawUrl,this.pageUrl]:[this.pageUrl];
    for(const url of urls){
      try {
        const state=await this.request(url);
        // A fallback/cached response must never undo a newer work or completion event.
        if(this.latest&&Date.parse(state.updated)<Date.parse(this.latest.updated))continue;
        this.latest=state;this.source=url===this.rawUrl?'repository':'pages';return state;
      } catch(e) {
        if(url===this.rawUrl)this.retryRawAt=this.now()+30000;
      }
    }
    throw new Error('no fresh public state');
  }
}
const stateReader=new PublicStateReader({rawUrl:location.hostname==='janbommi.github.io'
  ?'https://raw.githubusercontent.com/Janbommi/public_web/main/state.json':null});
let refreshTimer=null,reading=false,readFailures=0;
async function tick() {
  if(reading||document.hidden)return;
  clearTimeout(refreshTimer);reading=true;
  try {
    render(await stateReader.read());readFailures=0;
    $("conn").dataset.source=stateReader.source;
  } catch (e) {
    readFailures++;
    if(snap)render(snap); // Expire old success/offline status even during an outage.
    const conn = $("conn");
    conn.className = "conn down";
    $("conn-t").textContent = "상태 갱신 지연";
    $("conn-s").textContent = snap?"마지막 수신 상태 표시 · 연결 재시도 중":"연결 재시도 중";
  } finally {
    reading=false;
    if(!document.hidden)refreshTimer=setTimeout(tick,Math.min(60000,REFRESH_MS*2**Math.min(readFailures,4)));
  }
}

$("pick-close").addEventListener("click", () => { selected = null; render(snap); });
$("pick-close").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selected = null; render(snap); }
});

// 폭이 바뀌면 배율을 다시 잡는다 (폰 회전 등).
let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (snap) render(snap); }, 200);
});

tick();
document.addEventListener('visibilitychange',()=>{
  clearTimeout(refreshTimer);
  if(!document.hidden)tick();
});
</script>
